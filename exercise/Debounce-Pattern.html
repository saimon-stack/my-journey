<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Debounce Pattern</title>
</head>
<body>

<script>
function debounce(callback, delay) {
    let timer;

    return function (...args) {
        const context = this;

        clearTimeout(timer);

        timer = setTimeout(() => {
            callback.apply(context, args);
        }, delay);
    };
}
</script>

</body>
</html>
