<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Deep Clone - structuredClone</title>
</head>
<body>

<script>
    const originalGate = {
    id: "gate_01",
    type: "AND",
    position: { x: 100, y: 150 },
    inputs: [1, 0]
    };
    const cloneGate = structuredClone(originalGate);

    cloneGate.id = "gate_clone_01";
    cloneGate.position.x = 200;
    cloneGate.inputs[0] = 0;

    console.log("Original Gate:", originalGate);
    console.log("Clone gate:",cloneGate);
</script>

</body>
</html>
