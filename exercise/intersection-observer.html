<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IntersectionObserver Demo</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: #fff; }
        .spacer { height: 130vh; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #888; }
        #box { 
            width: 220px; 
            height: 220px; 
            background: #e53935; 
            margin: 40px auto 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border-radius: 16px; 
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(50px);
            opacity: 0;
        }
        #box.visible {
            background: #43a047;
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="spacer">Scroll down</div>

    <div id="box">Waiting to appear...</div>

    <script>
        const box = document.getElementById('box');

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    entry.target.innerText = '✅ Appeared!';
                    
                    console.log('Element is now visible!');

                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.4
        });

        observer.observe(box);
    </script>
</body>
</html>
