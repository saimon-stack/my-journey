<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Array Chunking Demo</title>
</head>
<body>
    <script>
        function chunkArray(arr, size) {
            const chunks = [];
            for (let i = 0; i < arr.length; i += size) {
                chunks.push(arr.slice(i, i + size));
            }
            return chunks;
        }

        const data = [1, 2, 3, 4, 5, 6, 7, 8];

        console.log(chunkArray(data, 3));
       
    </script>
</body>
</html>
