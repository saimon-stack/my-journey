<!DOCTYPE html>
	    <html lang="en">
	    <head>
            <meta charset="UTF-8" />
	        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	        <title>calculator</title>
            <style>
                body{
                    display: flex;
                    flex-direction:column;
                    align-items: center;
                    height: 100vh;
                    font-family: Arial, sans-serif;
                    background-color: #181A1B;
                    color: #E8E6E3;
                }

                .board{
                    display: grid; 
                    grid-template-columns: repeat(4, 60px); 
                    grid-template-rows: repeat(5, 60px);
                    gap: 10px; 
                    height: 360px; 
                    width: 260px; 
                    
                }

                .board button{
                    font-size: 20px;
                    font-weight: bold;
                    color: #E8E6E3;
                    border: none;
                    border-radius:250px;
                    cursor: pointer;
                    background-color: #262A2B;
                }

                .board button:nth-child(4n){
                    background-color: #C67A01
                }
            </style>
	    </head>
	    <body>	
            <h1>Calculator</h1>
            <div class="board">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
                <button>0</button>
                <button>,</button>
                <button>=</button>
                <button>/</button>
                <button>clear</button>
            </div>
	        <script></script>
	    </body>
	    </html>
